<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeFly GCS - Priority UAV Medical Delivery Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-mesh {
            background:
                radial-gradient(ellipse at 20% 10%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0e27 0%, #050816 100%);
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-intense {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(14, 165, 233, 0.2);
            box-shadow: 0 0 60px rgba(14, 165, 233, 0.15);
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(14, 165, 233, 0.6);
        }

        .status-live {
            background: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .pri-badge {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .pri-1 {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .pri-2 {
            background: rgba(251, 146, 60, 0.15);
            border-color: #fb923c;
            color: #fdba74;
        }

        .pri-3 {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #86efac;
        }

        .pri-4 {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .input-glass {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
            outline: none;
        }

        .btn-launch {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-launch:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.6);
        }

        .btn-launch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .leaflet-container {
            background: #0a0e27;
            border-radius: 1rem;
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: 1rem;
        }

        .priority-info {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid;
            background-color: rgba(2, 6, 23, 0.6);
        }

        .tab-btn {
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #0ea5e9;
            border-bottom: 2px solid #0ea5e9;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #0ea5e9;
            border-radius: 10px;
        }

        .mission-row {
            transition: all 0.2s ease;
        }

        .mission-row:hover {
            background: rgba(14, 165, 233, 0.05);
        }

        .auto-detect-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #c084fc;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: #0f172a;
            color: white;
            border: 1px solid #0ea5e9;
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.4);
            border-radius: 10px;
        }

        .custom-popup .leaflet-popup-tip {
            background: #0ea5e9;
        }
    </style>
</head>

<body class="bg-mesh p-4">

    <!-- Header -->
    <header class="glass-intense border-t-2 border-t-sky-500 rounded-2xl p-4 mb-4">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div
                    class="w-14 h-14 rounded-full bg-gradient-to-br from-sky-400 to-cyan-600 flex items-center justify-center shadow-lg shadow-sky-500/50">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </div>
                <div>
                    <h1
                        class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-300 via-cyan-200 to-blue-300 glow-text tracking-tight">
                        LifeFly GCS
                    </h1>
                    <p class="text-xs text-sky-400 font-semibold tracking-widest uppercase">AI-Powered Priority Medical
                        UAV Network</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-sm bg-black/30 p-2 px-4 rounded-xl">
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-wider">UTC</span>
                    <span id="clock" class="font-mono text-cyan-300 font-semibold"></span>
                </div>
                <div class="h-5 w-px bg-slate-700"></div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-wider">Firebase</span>
                    <div
                        class="flex items-center gap-1.5 px-2 py-1 rounded-md bg-green-500/10 border border-green-500/30">
                        <div class="w-2 h-2 rounded-full status-live"></div>
                        <span class="text-green-400 text-xs font-bold">LIVE</span>
                    </div>
                </div>
                <div class="h-5 w-px bg-slate-700"></div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-wider">Active Queue</span>
                    <span id="mission-count" class="text-xl font-bold text-sky-400 font-mono">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- Left Panel: Dispatch Form -->
        <div class="lg:col-span-4 glass rounded-2xl p-5 flex flex-col">
            <h2
                class="text-lg font-bold mb-5 text-white flex items-center gap-2 uppercase tracking-wide border-b border-sky-800/60 pb-3">
                <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Deploy UAV
            </h2>

            <form id="dispatch-form" class="space-y-4 flex-1 flex flex-col">
                <div>
                    <label class="block text-xs font-bold text-sky-300 tracking-wide mb-2 uppercase">Destination
                        Ground</label>
                    <input type="text" id="branch" required placeholder="e.g. Apollo Main Campus"
                        class="input-glass w-full rounded-xl p-3 text-sm font-medium text-white">
                </div>

                <div class="glass-intense rounded-xl p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-xs uppercase font-bold text-sky-400">Target Coordinate</div>
                        <button type="button" id="btn-gps"
                            class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-sky-500/20 text-sky-300 rounded hover:bg-sky-500/40 border border-sky-500/30 transition-colors flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            Auto-Locate
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Latitude</label>
                            <input type="number" step="any" id="lat" required placeholder="17.3850"
                                class="input-glass w-full rounded-lg p-2.5 text-xs font-mono font-bold text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1 uppercase font-semibold">Longitude</label>
                            <input type="number" step="any" id="lng" required placeholder="78.4867"
                                class="input-glass w-full rounded-lg p-2.5 text-xs font-mono font-bold text-white">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-sky-300 tracking-wide mb-2 uppercase">Payload
                        Definition</label>
                    <textarea id="payload" required rows="3" placeholder="e.g. Blood Pack O-Negative Emergency..."
                        class="input-glass w-full rounded-xl p-3 text-sm font-medium text-white resize-none"></textarea>

                    <div class="mt-2 flex items-center gap-2">
                        <div class="auto-detect-badge">
                            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13 7H7v6h6V7z" />
                                <path fill-rule="evenodd"
                                    d="M7 2a1 1 0 012 0v1h2V2a1 1 0 112 0v1h2a2 2 0 012 2v2h1a1 1 0 110 2h-1v2h1a1 1 0 110 2h-1v2a2 2 0 01-2 2h-2v1a1 1 0 11-2 0v-1H9v1a1 1 0 11-2 0v-1H5a2 2 0 01-2-2v-2H2a1 1 0 110-2h1V9H2a1 1 0 010-2h1V5a2 2 0 012-2h2V2zM5 5h10v10H5V5z"
                                    clip-rule="evenodd" />
                            </svg>
                            AI Priority Detector
                        </div>
                    </div>
                </div>

                <!-- Classic AI Priority Info Box -->
                <div id="priority-info" class="priority-info transition-all duration-300" style="display: none;"></div>

                <div class="flex-1"></div>

                <button type="submit" id="btn-submit"
                    class="btn-launch w-full py-4 rounded-xl font-bold uppercase tracking-widest text-white flex items-center justify-center gap-3">
                    <span class="text-sm">Initiate Launch</span>
                    <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Right Panel: Map + Tabs -->
        <div class="lg:col-span-8 flex flex-col gap-4">

            <!-- Map -->
            <div class="glass rounded-2xl p-2 relative" style="height: 400px;">
                <div class="absolute top-4 left-4 z-[1000] glass-intense rounded-lg px-4 py-2 pointer-events-none">
                    <h3 class="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-red-500 status-live"></div>
                        Tactical Satellite
                    </h3>
                </div>
                <div id="map"></div>
            </div>

            <!-- Tabs -->
            <div class="glass rounded-2xl p-5 flex-1">
                <div class="flex items-center gap-1 mb-4 border-b border-sky-800/50">
                    <button onclick="switchTab('queue')"
                        class="tab-btn active px-4 py-2 text-xs font-bold uppercase text-slate-400 hover:text-white"
                        data-tab="queue">
                        📡 Operations Queue
                    </button>
                    <button onclick="switchTab('telemetry')"
                        class="tab-btn px-4 py-2 text-xs font-bold uppercase text-slate-400 hover:text-white"
                        data-tab="telemetry">
                        🛰️ UAV Telemetry
                    </button>
                </div>

                <!-- Tab: Queue -->
                <div id="tab-queue" class="tab-content active overflow-y-auto" style="max-height: 400px;">
                    <table class="w-full text-left">
                        <thead
                            class="sticky top-0 bg-slate-900/95 text-[10px] uppercase font-bold tracking-wider text-sky-400">
                            <tr>
                                <th class="py-3 px-3">Priority</th>
                                <th class="py-3 px-3">Mission ID</th>
                                <th class="py-3 px-3">Branch</th>
                                <th class="py-3 px-3">Payload</th>
                                <th class="py-3 px-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="queue-body" class="text-slate-300 text-sm"></tbody>
                    </table>
                </div>

                <!-- Tab: Telemetry -->
                <div id="tab-telemetry" class="tab-content overflow-y-auto" style="max-height: 400px;">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="glass-intense rounded-xl p-4">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Flight Mode</div>
                            <div id="telem-mode" class="text-lg font-bold font-mono text-sky-400">—</div>
                        </div>
                        <div class="glass-intense rounded-xl p-4">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Battery</div>
                            <div id="telem-battery" class="text-lg font-bold font-mono text-emerald-400">—</div>
                        </div>
                        <div class="glass-intense rounded-xl p-4">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Altitude</div>
                            <div id="telem-altitude" class="text-lg font-bold font-mono text-purple-400">—</div>
                        </div>
                        <div class="glass-intense rounded-xl p-4">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">GPS Sats</div>
                            <div id="telem-gps" class="text-lg font-bold font-mono text-green-400">—</div>
                        </div>
                        <div class="glass-intense rounded-xl p-4 md:col-span-2">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Coordinates</div>
                            <div id="telem-pos" class="text-lg font-bold font-mono text-cyan-400">—</div>
                        </div>
                        <div class="glass-intense rounded-xl p-4 md:col-span-2">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Speed</div>
                            <div id="telem-speed" class="text-lg font-bold font-mono text-yellow-500">—</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgHXLUhpMhw0X2XMfoh6WYGey0Y1bFmWI",
            authDomain: "lifefly.firebaseapp.com",
            databaseURL: "https://lifefly-default-rtdb.firebaseio.com",
            projectId: "lifefly",
            storageBucket: "lifefly.firebasestorage.app",
            messagingSenderId: "1030073439901",
            appId: "1:1030073439901:web:53f36751d9719152ebe674"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        signInAnonymously(auth).catch(e => console.error("Firebase auth failed:", e));

        const missionsRef = ref(db, 'missions');
        const statusRef = ref(db, 'uav_status');
        const trackRef = ref(db, 'drone_track');

        // MAP SETUP
        const map = L.map('map', { zoomControl: false }).setView([17.3850, 78.4867], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri', maxZoom: 18
        }).addTo(map);

        setTimeout(() => map.invalidateSize(), 500);
        window.addEventListener('resize', () => map.invalidateSize());

        let mapMarkers = {};
        let droneMarker = null;

        // Custom base and drone icons
        const baseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background:rgba(14,165,233,0.2); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                   <div style="background:white; border:3px solid #0ea5e9; width:16px; height:16px; transform:rotate(45deg);"></div>
                   </div>`,
            iconSize: [40, 40], iconAnchor: [20, 20]
        });
        L.marker([17.3850, 78.4867], { icon: baseIcon }).addTo(map).bindPopup("<b>GCS Base Station</b>");

        const droneIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background:rgba(16,185,129,0.3); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; animation: blink 1s infinite;">
                   <div style="background:#10b981; border:2px solid black; width:12px; height:12px; border-radius:50%;"></div>
                   </div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        // ═══ CLASSIC AI DETECTOR FUNCTION ═══
        function detectPriority(text) {
            text = text.toLowerCase();
            const critical = ['blood', 'plasma', 'organ', 'kidney', 'lung', 'heart', 'venom', 'anti-venom', 'epinephrine', 'trauma', 'hemorrhage', 'stroke', 'emergency', 'critical', 'resuscitation', 'sepsis', 'defibrillator'];
            const urgent = ['insulin', 'diabetic', 'surgery', 'surgical', 'oxygen', 'o2', 'burn', 'fracture', 'urgent', 'chemotherapy', 'asthma'];
            const low = ['records', 'paperwork', 'ppe', 'gloves', 'document', 'routine', 'supplies', 'inventory'];

            for (let kw of critical) if (text.includes(kw)) return { priority: 1, label: 'P1-CRITICAL', color: '#ef4444', desc: '⚡ LIFE-THREATENING — Immediate UAV dispatch', reason: `Detected: "${kw}"` };
            for (let kw of urgent) if (text.includes(kw)) return { priority: 2, label: 'P2-URGENT', color: '#fb923c', desc: '🔥 TIME-SENSITIVE — Dispatch within 10 minutes', reason: `Detected: "${kw}"` };
            for (let kw of low) if (text.includes(kw)) return { priority: 4, label: 'P4-LOW', color: '#3b82f6', desc: '📋 NON-URGENT — Batch delivery', reason: `Detected: "${kw}"` };

            return { priority: 3, label: 'P3-STANDARD', color: '#22c55e', desc: '📦 ROUTINE — Standard scheduled delivery', reason: 'Default classification' };
        }

        // Live UI update for AI Detector
        document.getElementById('payload').addEventListener('input', (e) => {
            const payload = e.target.value;
            const info = document.getElementById('priority-info');
            if (payload.length > 2) {
                const detected = detectPriority(payload);
                info.style.display = 'block';
                info.style.borderColor = detected.color;
                info.innerHTML = `
                    <div style="display: flex; align-items: start; gap: 0.5rem; justify-content: space-between;">
                        <div>
                            <strong style="color: ${detected.color}; font-family: 'JetBrains Mono'; font-size: 0.8rem;">${detected.label}</strong>
                            <div style="font-size: 0.70rem; color: #cbd5e1; margin-top: 2px;">${detected.desc}</div>
                        </div>
                        <div style="font-size: 0.65rem; color: #94a3b8; font-style: italic; background: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 4px;">
                            ${detected.reason}
                        </div>
                    </div>`;
            } else {
                info.style.display = 'none';
            }
        });

        // ═══ GPS ═══
        document.getElementById('btn-gps').addEventListener('click', () => {
            const btn = document.getElementById('btn-gps');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">Locating...</span>';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
                        document.getElementById('lng').value = pos.coords.longitude.toFixed(6);
                        map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { duration: 1.5 });
                        btn.innerHTML = originalText;
                    },
                    (err) => { alert('GPS Error: ' + err.message); btn.innerHTML = originalText; },
                    { enableHighAccuracy: true }
                );
            } else {
                alert('Geolocation is not supported by your browser.');
                btn.innerHTML = originalText;
            }
        });

        // ═══ UI HELPERS ═══
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        };

        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + 'Z';
        }, 1000);

        // ═══ FORM SUBMISSION ═══
        let mCount = 1000;
        document.getElementById('dispatch-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const spinner = document.getElementById('spinner');

            mCount++;
            const payloadText = document.getElementById('payload').value;
            const detected = detectPriority(payloadText);

            const mission = {
                request_id: `UAV-${mCount}`,
                branch_name: document.getElementById('branch').value,
                latitude: parseFloat(document.getElementById('lat').value),
                longitude: parseFloat(document.getElementById('lng').value),
                request_details: payloadText,
                priority: detected.priority,
                priority_label: detected.label,
                ai_priority_reason: detected.reason,
                status: 'QUEUED',
                timestamp: new Date().toISOString(),
                dispatched_from: 'WEB_GCS'
            };

            btn.disabled = true; spinner.classList.remove('hidden');

            try {
                await push(missionsRef, mission);
                e.target.reset();
                document.getElementById('priority-info').style.display = 'none';

                // Show simple JS alert toast style (since we removed complex toasts)
                alert(`SUCCESS! Dispached UAV-${mCount} as ${detected.label}`);
            } catch (err) {
                alert(`Dispatch failed: ${err.message}`);
            } finally {
                btn.disabled = false; spinner.classList.add('hidden');
            }
        });

        // ═══ FIREBASE SYNC: QUEUE ═══
        onValue(missionsRef, (snapshot) => {
            const data = snapshot.val();
            const dataArray = data ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : [];
            document.getElementById('mission-count').textContent = dataArray.length;

            const tbody = document.getElementById('queue-body');
            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-slate-500">No active missions in queue</td></tr>';
            } else {
                // Sort by priority -> lowest number first
                dataArray.sort((a, b) => (a.priority || 3) - (b.priority || 3) || a.timestamp.localeCompare(b.timestamp));
                tbody.innerHTML = dataArray.map(m => {
                    const priClass = `pri-${m.priority || 3}`;
                    let sCol = m.status === 'QUEUED' ? 'text-yellow-400' : 'text-emerald-400';
                    return `
                    <tr class="border-b border-slate-800/50 hover:bg-white/5 transition-colors">
                        <td class="py-3 px-3"><span class="pri-badge ${priClass} px-2 py-1 text-[10px] rounded border">${m.priority_label || 'P3'}</span></td>
                        <td class="py-3 px-3 font-mono text-cyan-300 text-xs">${m.request_id || m.key}</td>
                        <td class="py-3 px-3 text-xs">${m.branch_name}</td>
                        <td class="py-3 px-3 text-xs truncate max-w-xs">${m.request_details}</td>
                        <td class="py-3 px-3 font-bold text-xs ${sCol}">${m.status || 'QUEUED'}</td>
                    </tr>`;
                }).join('');
            }

            // Update Target Markers
            Object.values(mapMarkers).forEach(m => map.removeLayer(m));
            mapMarkers = {};
            dataArray.forEach(m => {
                if (m.latitude && m.longitude && m.status !== 'COMPLETED') {
                    const color = ['#ef4444', '#fb923c', '#22c55e', '#3b82f6'][(m.priority || 3) - 1];
                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div style="background:${color}; width:12px; height:12px; border:2px solid white; border-radius:50%; box-shadow:0 0 10px ${color};"></div>`,
                        iconAnchor: [6, 6]
                    });
                    const marker = L.marker([m.latitude, m.longitude], { icon }).addTo(map)
                        .bindPopup(`<div class="custom-popup px-3 py-2"><b style="color:${color}">${m.request_id}</b><br><span style="font-size:10px">${m.request_details}</span></div>`);
                    mapMarkers[m.key] = marker;
                }
            });
        });

        // ═══ FIREBASE SYNC: TELEMETRY & LIVE DRONE TRACKING ═══
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('telem-mode').textContent = data.mode || '—';
                document.getElementById('telem-battery').textContent = `${parseFloat(data.battery_pct).toFixed(1)}%`;
                document.getElementById('telem-altitude').textContent = `${parseFloat(data.altitude_m).toFixed(1)} m`;
                document.getElementById('telem-gps').textContent = data.gps_satellites || '—';
                document.getElementById('telem-speed').textContent = `${parseFloat(data.ground_speed_ms).toFixed(1)} m/s`;
                document.getElementById('telem-pos').textContent = `${parseFloat(data.lat).toFixed(6)}, ${parseFloat(data.lng).toFixed(6)}`;
            }
        });

        onValue(trackRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat) {
                if (!droneMarker) {
                    droneMarker = L.marker([data.lat, data.lng], { icon: droneIcon }).addTo(map);
                } else {
                    droneMarker.setLatLng([data.lat, data.lng]);
                }
                const popupStr = `<b>DRONE ACTIVE</b><br>Mode: ${data.status}<br>Mission: ${data.mission_id}`;
                if (!droneMarker.getPopup()) {
                    droneMarker.bindPopup(`<div class="custom-popup px-2 py-1">${popupStr}</div>`);
                } else {
                    droneMarker.setPopupContent(`<div class="custom-popup px-2 py-1">${popupStr}</div>`);
                }
            }
        });
    </script>
</body>

</html>
